clusterName: ""

# Namespace naming:
#   namespaceCount == 1 -> one namespace named `namespace` (e.g. controlplane-test)
#   namespaceCount  > 1 -> `<namespace>-0` .. `<namespace>-(namespaceCount-1)`
namespace: controlplane-test
namespaceCount: 1

# Number of dummy Deployments + Services. Service `i` lands in namespace
# `i mod namespaceCount`; names stay `dummy-svc-<i>` in every namespace.
serviceCount: 10

replicasPerService: 3

# Sidecar CR scoping mode. One of:
#   none      - no Sidecar CRs; proxies see every Service in the mesh.
#   namespace - one Sidecar (no workloadSelector) in each workload namespace;
#               egress limited to the own namespace and istio-system.
#   explicit  - one Sidecar per Deployment, selected by app=dummy-svc-<i>,
#               in the Deployment's namespace.
sidecarScoping: none

# Extra egress hosts appended to every Sidecar CR (e.g. `monitoring/*`).
sidecarExtraEgressHosts: []

image:
  repository: busybox
  # Keep in sync with BUSYBOX_VERSION in config/versions.env (001 passes --set image.tag).
  tag: "1.37.0"

service:
  port: 8080
