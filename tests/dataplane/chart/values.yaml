clusterName: ""

# All cluster names in the mesh. A per-cluster Service `dataplane-server-<name>`
# is rendered for each, so every cluster resolves every target hostname locally
# (no Istio DNS proxying needed).
allClusterNames: []

namespace: dataplane-test

# role: server, client, or both
role: server

image:
  repository: fortio/fortio
  # Keep in sync with FORTIO_VERSION in config/versions.env (001 passes --set image.tag).
  tag: "1.75.3"

service:
  port: 8080

server:
  # fortio server pods per cluster. The per-cluster Service load-balances across
  # them, so the local target and every cross-cluster target get the same server
  # capacity. Keep in sync with DATAPLANE_SERVER_REPLICAS in config/options.env
  # (001 passes --set server.replicas).
  replicas: 2

# Numeric UID for the test containers: the busybox and fortio images run as root, so
# Kubernetes cannot start them under runAsNonRoot without one. values-openshift.yaml clears
# it: OpenShift assigns a UID from the namespace range (tests/lib/platform.sh adds it there).
runAsUser: 65534
