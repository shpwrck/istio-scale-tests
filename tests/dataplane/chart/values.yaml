clusterName: ""

# All cluster names in the mesh. A per-cluster Service `dataplane-server-<name>`
# is rendered for each, so every cluster resolves every target hostname locally
# (no Istio DNS proxying needed).
allClusterNames: []

namespace: dataplane-test

# role: server, client, or both
role: server

image:
  repository: fortio/fortio
  # Keep in sync with FORTIO_VERSION in config/versions.env (001 passes --set image.tag).
  tag: "1.75.3"

service:
  port: 8080
