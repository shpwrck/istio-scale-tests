{{- if .Values.backer.enabled }}
# Pre-warmed backer. Not selected by the canary Service until the probe labels
# the running pod at t0, so P3 excludes pod startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: propagation-canary
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "propagation-test.canary.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "propagation-test.canary.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "propagation-test.canary.labels" . | nindent 8 }}
        sidecar.istio.io/inject: "true"
        {{- if .Values.backer.active }}
        {{- include "propagation-test.canary.activeSelectorLabels" . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: http-echo
          image: {{ .Values.backer.image.repository }}:{{ .Values.backer.image.tag }}
          imagePullPolicy: {{ .Values.backer.image.pullPolicy }}
          args:
            - -listen=:{{ .Values.service.port }}
            - -text={{ .Values.clusterName }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            # Ready before t0 so the label flip is a pure config push.
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            {{- with $.Values.runAsUser }}
            runAsUser: {{ . }}
            {{- end }}
{{- end }}
