namespace: churn-test

deploymentCount: 5

baseReplicas: 1

# busybox `sleep` ignores SIGTERM, so a pod would wait out the default 30s. A short
# grace lets scaled-down pods leave before the next iteration's baseline.
terminationGracePeriodSeconds: 5

# Keep in sync with BUSYBOX_VERSION in config/versions.env (001 passes it with --set).
image:
  repository: busybox
  tag: "1.37.0"

watcher:
  image:
    repository: busybox
    tag: "1.37.0"

service:
  port: 8080

# Numeric UID for the test containers: the busybox and fortio images run as root, so
# Kubernetes cannot start them under runAsNonRoot without one. values-openshift.yaml clears
# it: OpenShift assigns a UID from the namespace range (tests/lib/platform.sh adds it there).
runAsUser: 65534
