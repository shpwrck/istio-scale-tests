# Shared namespace for both fortio and churn-target resources.
namespace: churn-dataplane-test

# Number of churn-target Deployments to create (independent of fortio).
churnDeploymentCount: 5

# Initial replicas for each churn-target Deployment.
churnBaseReplicas: 1

# busybox `sleep` ignores SIGTERM, so a churn-target pod would wait out the default
# 30s. A short grace lets scaled-down pods leave before the next baseline window.
churnTerminationGracePeriodSeconds: 5

# This cluster's name. When set, the fortio-server pod gets the label
# cluster: <clusterName> (001 passes the kube context).
clusterName: ""

# Every cluster name in the mesh. Each gets a Service fortio-server-<name> that
# selects only that cluster's fortio-server pod, so the harness can check each
# remote on its own: the merged fortio-server Service spans every cluster, and
# Istio retries a failed request on another endpoint, which hides a dead remote.
# Empty renders no per-cluster Service (requires clusterName when set).
allClusterNames: []

# fortio deployment role: server, client, or both.
# - server: only fortio-server Deployment+Service
# - client: only fortio-client Deployment
# - both:   both server and client
fortioRole: both

# Image used for churn-target workloads (busybox sleep pod). Keep in sync with
# BUSYBOX_VERSION in config/versions.env (001 passes it with --set).
churnImage:
  repository: busybox
  tag: "1.37.0"

# Image used for fortio workloads. Keep in sync with FORTIO_VERSION in
# config/versions.env (001 passes it with --set).
fortioImage:
  repository: fortio/fortio
  tag: "1.75.3"

# Service port for fortio-server and churn-target services.
service:
  port: 8080

# Numeric UID for the test containers: the busybox and fortio images run as root, so
# Kubernetes cannot start them under runAsNonRoot without one. values-openshift.yaml clears
# it: OpenShift assigns a UID from the namespace range (tests/lib/platform.sh adds it there).
runAsUser: 65534
