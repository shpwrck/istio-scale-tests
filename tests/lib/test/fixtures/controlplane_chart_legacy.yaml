    app: dummy-svc-0
    app.kubernetes.io/name: controlplane-test
    app.kubernetes.io/instance: controlplane-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-svc-0
  template:
    metadata:
      labels:
        app: dummy-svc-0
        app.kubernetes.io/name: controlplane-test
        app.kubernetes.io/instance: controlplane-test
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: sleep
          image: busybox:1.37.0
          command: ["sleep", "infinity"]
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
