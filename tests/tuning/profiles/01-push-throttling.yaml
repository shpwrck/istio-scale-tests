# Fewer, larger xDS pushes during churn, at the cost of propagation latency.
#
# Istio 1.30 defaults (pilot/pkg/features/tuning.go): PILOT_DEBOUNCE_AFTER=100ms,
# PILOT_DEBOUNCE_MAX=10s, PILOT_PUSH_THROTTLE=0, which means min(15+5*GOMAXPROCS, 100).
# The chart sets GOMAXPROCS from the CPU limit, so the baseline's 4-CPU istiod allows
# 35 concurrent pushes. A lower cap reduces lock contention on busy istiods.
#
# Suites: churn, churn-dataplane, propagation, controlplane.

description: >-
  Wait 200ms (default 100ms) for more changes before pushing, debounce for up to
  15s (default 10s), and allow at most 20 concurrent pushes (default 35 here).

ossm_support: configurable
ossm_support_detail: >-
  Set through spec.values.pilot.env on the Istio CR. Red Hat does not document
  individual PILOT_* variables for OSSM 3.

istio_cr_patch:
  spec:
    values:
      pilot:
        env:
          PILOT_DEBOUNCE_AFTER: "200ms"
          PILOT_DEBOUNCE_MAX: "15s"
          PILOT_PUSH_THROTTLE: "20"

resources: []
