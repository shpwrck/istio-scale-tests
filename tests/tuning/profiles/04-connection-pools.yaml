# Mesh-wide connection pool limits, outlier detection and connection recycling.
#
# A DestinationRule in the root namespace (istio-system) applies to every service
# that has no DestinationRule of its own. Envoy's default limits are effectively
# unlimited; maxRequestsPerConnection: 100 recycles each upstream connection after
# 100 requests. The rule sets no TLS mode, so auto mTLS still applies.
#
# Suites: dataplane, churn-dataplane.

description: >-
  Root-namespace DestinationRule for *.svc.cluster.local with connection pool
  limits, outlier detection and a 100-request connection lifetime.

ossm_support: supported

istio_cr_patch: {}

resources:
  - apiVersion: networking.istio.io/v1
    kind: DestinationRule
    metadata:
      name: tuning-connection-pool
      namespace: istio-system
    spec:
      host: "*.svc.cluster.local"
      trafficPolicy:
        connectionPool:
          tcp:
            maxConnections: 1024
            connectTimeout: 5s
            tcpKeepalive:
              time: 300s
              interval: 30s
              probes: 3
          http:
            http2MaxRequests: 1024
            http1MaxPendingRequests: 1024
            maxRequestsPerConnection: 100
        outlierDetection:
          consecutive5xxErrors: 5
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 50
