{{- if .Values.waitForCacerts.enabled }}
# PreSync gate: hold the Istio CR until the hub has pushed cacerts. istiod reads
# cacerts only at startup; without it, it uses a self-signed root and the
# members never trust each other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-for-cacerts
  namespace: istio-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "spoke-ossm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-for-cacerts
  namespace: istio-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "spoke-ossm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cacerts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-for-cacerts
  namespace: istio-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "spoke-ossm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wait-for-cacerts
subjects:
  - kind: ServiceAccount
    name: wait-for-cacerts
    namespace: istio-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-cacerts
  namespace: istio-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "spoke-ossm.labels" . | nindent 4 }}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wait-for-cacerts
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: wait-for-cacerts
      restartPolicy: Never
      containers:
        - name: wait
          image: {{ .Values.waitForCacerts.image | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -u
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              url=https://kubernetes.default.svc/api/v1/namespaces/istio-system/secrets/cacerts
              code=none
              # Real elapsed time, within timeoutSeconds: each request and pause gets at
              # most what is left.
              start=$(date +%s)
              deadline=$((start + {{ int .Values.waitForCacerts.timeoutSeconds }}))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                left=$((deadline - $(date +%s)))
                [ "$left" -lt 10 ] || left=10
                [ "$left" -ge 1 ] || left=1
                # Metadata only: the CA key never reaches this pod.
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time "$left" --cacert "$sa/ca.crt" \
                  -H "Authorization: Bearer $(cat "$sa/token")" \
                  -H 'Accept: application/json;as=PartialObjectMetadata;g=meta.k8s.io;v=v1' \
                  "$url") || code="curl exit $?"
                if [ "$code" = 200 ]; then
                  echo "cacerts present; installing Istio."
                  exit 0
                fi
                echo "waiting for cacerts in istio-system ($(($(date +%s) - start))s, HTTP ${code})"
                left=$((deadline - $(date +%s)))
                [ "$left" -lt 10 ] || left=10
                [ "$left" -le 0 ] || sleep "$left"
              done
              echo "ERROR: cacerts not pushed after {{ .Values.waitForCacerts.timeoutSeconds }}s (last answer: HTTP ${code}; check hub-mesh-push-secrets on the hub)"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            {{- with .Values.waitForCacerts.runAsUser }}
            runAsUser: {{ . }}
            {{- end }}
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
{{- end }}
