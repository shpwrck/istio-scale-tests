apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
  {{- if .Values.argoSyncWaves.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.argoSyncWaves.istioCni | quote }}
  {{- end }}
spec:
  namespace: istio-cni
  profile: {{ required "profile is required (a Sail profile: default, openshift, ...)" .Values.profile }}
  version: {{ .Values.istioVersion | quote }}
  {{- with .Values.istioCni.values }}
  values:
    {{- toYaml . | nindent 4 }}
  {{- end }}
