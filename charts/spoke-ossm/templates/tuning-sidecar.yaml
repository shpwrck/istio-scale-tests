{{- if .Values.tuningBaseline.sidecar.enabled }}
{{- /*
  Profile 01: the root-namespace Sidecar (no workloadSelector) limits every proxy's
  egress to egressHosts. The gateways are also injected proxies, so each gets a
  workloadSelector Sidecar with all-namespace egress, which takes precedence.
*/}}
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: istio-system
  labels:
    {{- include "spoke-ossm.labels" . | nindent 4 }}
  {{- if .Values.argoSyncWaves.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.argoSyncWaves.tuning | quote }}
  {{- end }}
spec:
  egress:
    - hosts:
        {{- range $h := .Values.tuningBaseline.sidecar.egressHosts }}
        - {{ $h | quote }}
        {{- end }}
---
{{- /* Ingress gateway: full egress (it routes mesh-verify traffic across clusters). */}}
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: gateway-ingress-full-egress
  namespace: istio-system
  labels:
    {{- include "spoke-ossm.labels" . | nindent 4 }}
  {{- if .Values.argoSyncWaves.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.argoSyncWaves.tuning | quote }}
  {{- end }}
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  egress:
    - hosts:
        - "*/*"
---
{{- /* East-west gateway: full egress (AUTO_PASSTHROUGH does not need it; kept so a future route is not narrowed). */}}
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: gateway-eastwest-full-egress
  namespace: istio-system
  labels:
    {{- include "spoke-ossm.labels" . | nindent 4 }}
  {{- if .Values.argoSyncWaves.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.argoSyncWaves.tuning | quote }}
  {{- end }}
spec:
  workloadSelector:
    labels:
      istio: eastwestgateway
  egress:
    - hosts:
        - "*/*"
{{- end }}
