# Standalone Argo CD Application (not part of the app-of-apps): deploys the Gateway API
# multicluster ingress check (charts/mesh-verify-gateway-api) on every mesh member, with the echo
# workload on ONE member. What it answers and how to run it: tests/gateway-api/README.md.
# Three placeholders stay in git and are filled in on the way to the hub (Apply):
#   - <repo-url> and <revision>: the repo and revision the hub's root Application syncs (set
#     by terraform/platform), so the check deploys the same charts as the mesh. Applied as the
#     placeholders, this Application shows a ComparisonError and deploys nothing;
#   - <workload-cluster>: the ACM ManagedCluster name of the member that runs the workload
#     (oc --context <acm-hub-ctx> get managedclusters). Applied as the placeholder, every
#     member's Application fails to render with a message.
# Apply:  read -r REPO REV < <(oc --context <acm-hub-ctx> -n openshift-gitops get application \
#           hub-gitops-root -o jsonpath='{.spec.source.repoURL} {.spec.source.targetRevision}')
#         sed -e "s|<repo-url>|${REPO:?}|g" -e "s|<revision>|${REV:?}|g" \
#           -e 's|<workload-cluster>|<managed-cluster-name>|' charts/mesh-verify-gateway-api-appset.yaml \
#           | oc --context <acm-hub-ctx> apply -f -
# Remove: oc --context <acm-hub-ctx> delete -f charts/mesh-verify-gateway-api-appset.yaml
#         (the finalizers remove the ApplicationSet, the per-member Applications and all they
#         deployed, including the Gateway API Gateway in istio-system, the backend namespace
#         mesh-verify-gwapi-shared and the workload member's mesh-verify-gwapi-remote)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-verify-gateway-api-appset
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: mesh-verify-gateway-api
    app.kubernetes.io/component: mesh-verify-gateway-api-appset
spec:
  project: default
  source:
    repoURL: <repo-url>
    targetRevision: <revision>
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-mesh-verify-gateway-api-appset
      valueFiles:
        - values-mesh-verify-gateway-api.yaml
      parameters:
        - name: repo.url
          value: <repo-url>
        - name: repo.revision
          value: <revision>
        - name: placement.name
          value: acm-openshift-gitops-placement
        - name: template.source.helm.valuesObject.workloadCluster
          value: <workload-cluster>
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
