# Namespace for the Red Hat cert-manager operator Subscription.
namespace: cert-manager-operator

operatorGroup:
  name: openshift-cert-manager-operator

subscription:
  name: openshift-cert-manager-operator
  channel: stable-v1
  package: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# oc image for the PreDelete cleanup Job. Match the tag to the cluster's OpenShift minor.
image:
  repository: registry.redhat.io/openshift4/ose-cli-rhel9
  tag: v4.21

# Role for the Argo CD application controller (creates the cleanup hook).
rbac:
  enabled: true
  argocd:
    namespace: openshift-gitops
    serviceAccountName: openshift-gitops-argocd-application-controller
