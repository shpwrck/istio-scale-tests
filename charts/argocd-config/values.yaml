argocd:
  name: openshift-gitops
  applicationSet:
    enabled: true
    env: []
    sourceNamespaces: []

  controller:
    sharding:
      enabled: true
      dynamicScalingEnabled: true
      minShards: 1
      maxShards: 20
      clustersPerShard: 3
    shardingAlgorithm: consistent-hashing
    processors:
      status: 50
      operation: 25
    appSync: 300s
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "2"
        memory: 4Gi

  repo:
    replicas: 2
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi

  server:
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "500m"
        memory: 1Gi

  applicationSetResources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "500m"
      memory: 1Gi

  # Replaces Argo CD's built-in resource.exclusions, so it restates the 3.x
  # defaults (high-churn kinds) plus Events. Without them the controller caches
  # every EndpointSlice on every cluster and OOMs on a busy hub.
  resourceExclusions:
    - apiGroups: ["", "events.k8s.io"]
      kinds: ["Event"]
      clusters: ["*"]
    - apiGroups: ["", "discovery.k8s.io"]
      kinds: ["Endpoints", "EndpointSlice"]
      clusters: ["*"]
    - apiGroups: ["coordination.k8s.io"]
      kinds: ["Lease"]
      clusters: ["*"]
    - apiGroups: ["authentication.k8s.io", "authorization.k8s.io"]
      kinds: ["SelfSubjectReview", "TokenReview", "LocalSubjectAccessReview", "SelfSubjectAccessReview", "SelfSubjectRulesReview", "SubjectAccessReview"]
      clusters: ["*"]
    - apiGroups: ["certificates.k8s.io"]
      kinds: ["CertificateSigningRequest"]
      clusters: ["*"]
    - apiGroups: ["cert-manager.io"]
      kinds: ["CertificateRequest"]
      clusters: ["*"]

  # Argo CD has no built-in health for Sail's Istio/IstioCNI, so it would call
  # them Healthy at once and apply the next sync wave (Sidecars, Telemetry)
  # before istiod's validating webhook serves. Healthy only when Ready.
  resourceHealthChecks:
    - group: sailoperator.io
      kind: Istio
      check: |
        hs = {status = "Progressing", message = "Waiting for Ready"}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "Ready" and c.status == "True" then
              hs.status = "Healthy"
              hs.message = "Ready"
            elseif c.type == "Reconciled" and c.status == "False" and c.reason == "ReconcileError" then
              return {status = "Degraded", message = c.message or c.reason}
            end
          end
        end
        return hs
    - group: sailoperator.io
      kind: IstioCNI
      check: |
        hs = {status = "Progressing", message = "Waiting for Ready"}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "Ready" and c.status == "True" then
              hs.status = "Healthy"
              hs.message = "Ready"
            elseif c.type == "Reconciled" and c.status == "False" and c.reason == "ReconcileError" then
              return {status = "Degraded", message = c.message or c.reason}
            end
          end
        end
        return hs
