operatorNamespace: openshift-operators

subscription:
  name: servicemeshoperator3
  # Pinned minor channel. Each OSSM minor supports one Istio minor:
  # stable-3.4 serves Istio v1.30.x (charts/spoke-ossm istioVersion).
  channel: stable-3.4
  package: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# PreDelete hook Job that removes the Subscription and its CSV when the
# Argo CD Application is deleted. Match the image to the cluster's OpenShift minor.
cleanup:
  image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.21

argoSyncWaves:
  enabled: true
  subscription: "5"
