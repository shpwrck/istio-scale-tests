{{- /*
  PreDelete hook: delete the Subscription first (so OLM cannot reinstall the
  CSV), then the CSV by its OLM owner label. Every step tolerates "not found".
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-csv
  namespace: {{ .Values.operatorNamespace | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-csv
  namespace: {{ .Values.operatorNamespace | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-csv
  namespace: {{ .Values.operatorNamespace | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-csv
subjects:
  - kind: ServiceAccount
    name: cleanup-csv
    namespace: {{ .Values.operatorNamespace | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-csv-{{ .Values.subscription.package }}
  namespace: {{ .Values.operatorNamespace | quote }}
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "spoke-ossm-operator.labels" . | nindent 4 }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanup-csv
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: cleanup-csv
      restartPolicy: Never
      containers:
        - name: cleanup
          image: {{ .Values.cleanup.image | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS={{ .Values.operatorNamespace | quote }}
              SUB={{ .Values.subscription.name | quote }}
              PACKAGE={{ .Values.subscription.package | quote }}
              echo "Deleting Subscription $SUB in $NS..."
              oc delete subscription.operators.coreos.com "$SUB" -n "$NS" --ignore-not-found --wait=false || true
              echo "Deleting CSVs labelled operators.coreos.com/${PACKAGE}.${NS} in $NS..."
              oc delete csv -n "$NS" -l "operators.coreos.com/${PACKAGE}.${NS}" --ignore-not-found --wait=false || true
              echo "Cleanup complete."
