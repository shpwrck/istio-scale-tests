# Per-cluster mesh-wiring gate: the pod is Ready only while this mesh member is
# fully wired (remote secrets present and ingested by istiod).

# Not istio-injected: the gate must not depend on the mesh it checks.
namespace: mesh-wiring-verify

# Mesh size, set by Terraform. With N > 0: at least N remote secrets, istiod
# manages at least N clusters, and at least N-1 of them are remote.
# With 0: istiod must manage at least as many clusters as there are remote secrets.
expectedMembers: 0

# Namespace with the Istio remote secrets and istiod.
istioNamespace: istio-system

# Stage 2: read istiod_managed_clusters from istiod's /metrics.
istiodCheck:
  enabled: true
  host: istiod.istio-system.svc
  port: 15014
  curlTimeoutSeconds: 5

image:
  # The cluster's "cli" imagestream (oc, bash, curl). Needs the internal image
  # registry (managementState: Managed). Without it, use
  # registry.redhat.io/openshift4/ose-cli-rhel9 with the cluster's OpenShift minor (e.g. v4.21).
  repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccountName: mesh-wiring-verify

# failureThreshold > 1 rides out a single API or istiod blip.
probe:
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 2
  successThreshold: 1

# oc is a large binary; its pages count against the memory limit. Below ~256Mi
# every probe re-reads it from disk and the check overruns the probe timeout.
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi
