# The verifier counts remote secrets (metadata only), reads the public root
# certificate from cacerts, the istio-ca-root-cert ConfigMap and the east-west
# gateway Service. Scoped to istio-system (Role, not ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-wiring-verify-read-secrets
  namespace: {{ .Values.istioNamespace }}
  labels:
    {{- include "mesh-wiring-verify.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["istio-ca-root-cert"]
    verbs: ["get"]
  {{- if .Values.eastWestCheck.enabled }}
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ .Values.eastWestCheck.service | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-wiring-verify-read-secrets
  namespace: {{ .Values.istioNamespace }}
  labels:
    {{- include "mesh-wiring-verify.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-wiring-verify-read-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Values.namespace }}
