# Shared defaults. Each values-<preset>.yaml sets only what differs:
# identity, RBAC role names, applicationSet.name, destination and template.
applicationSetNamespace: openshift-gitops
applicationSetControllerNamespace: openshift-gitops

identity:
  component: ""

placement:
  name: acm-openshift-gitops-placement
  # Leave empty to select every PlacementDecision labeled for placement.name
  # (OCM splits large placements across several PlacementDecisions).
  placementDecisionName: ""

# Extra list-generator entry for the hub's own Argo cluster.
inClusterGenerator:
  enabled: false
  clusterName: in-cluster

# Created by Terraform (kubernetes_manifest.placement_generator_configmap).
generatorConfigMap:
  name: acm-gitops-placement-generator

clusterDecisionResource:
  enabled: true
  requeueAfterSeconds: 30
  # Optional override; defaults to
  # cluster.open-cluster-management.io/placement: <placement.name>
  labelSelector: {}

placementRbac:
  create: true
  roleName: ""
  roleBindingName: ""
  applicationSetServiceAccountName: openshift-gitops-applicationset-controller

argocdApplicationControllerRbac:
  create: true
  roleName: ""
  roleBindingName: ""
  serviceAccountName: openshift-gitops-argocd-application-controller
  serviceAccountNamespace: openshift-gitops

applicationSet:
  name: ""

destination:
  # clusterName: every Placement cluster by name; inClusterServer: hub API only.
  mode: clusterName
  namespace: ""

template:
  applicationNameSuffix: ""
  source:
    path: ""
    # releaseName (clusterName mode only), parameters, valuesObject.
    helm: {}

repo:
  url: ""
  revision: main
