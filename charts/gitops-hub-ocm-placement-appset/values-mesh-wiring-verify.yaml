# Preset: mesh-wiring health gate on every mesh member. Installed by Terraform
# (platform_gitops.tf), which sets
# template.source.helm.valuesObject.expectedMembers to the mesh size.
identity:
  component: mesh-wiring-verify

placementRbac:
  roleName: openshift-gitops-ocm-placement-mesh-wiring-verify
  roleBindingName: openshift-gitops-ocm-placement-mesh-wiring-verify

argocdApplicationControllerRbac:
  roleName: gitops-mesh-wiring-verify-appset-argocd-sync
  roleBindingName: gitops-mesh-wiring-verify-appset-argocd-sync

applicationSet:
  name: mesh-wiring-verify

destination:
  mode: clusterName
  namespace: mesh-wiring-verify

template:
  applicationNameSuffix: mesh-wiring-verify
  source:
    path: charts/mesh-wiring-verify
    helm:
      releaseName: mesh-wiring-verify
      # Generator placeholders must go in parameters; static values go in
      # valuesObject so they are set by name.
      parameters:
        - name: clusterName
          value: "{{clusterName}}"
      # 0 = consistency-only checks (no Terraform override).
      valuesObject:
        expectedMembers: 0
