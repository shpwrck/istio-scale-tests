{{- $pn := .Values.placement.name | default "acm-openshift-gitops-placement" }}
{{- $pdec := .Values.placement.placementDecisionName | default "" }}
{{- $mode := required "destination.mode must be clusterName or inClusterServer" .Values.destination.mode }}
{{- $gen := include "gitops-hub-ocm-placement-appset.generator" . }}
{{- $cp := include "gitops-hub-ocm-placement-appset.clusterParam" . }}
{{- $cpKey := ternary "clusterName" "name" (eq $gen "clusterDecisionResource") }}
{{- $membersOn := include "gitops-hub-ocm-placement-appset.membersEnabled" . }}
{{- $hubOn := .Values.inClusterGenerator.enabled }}
{{- $hubOn = or (eq $hubOn true) (eq ($hubOn | toString) "true") }}
{{- if not (or $membersOn $hubOn) }}
{{- fail "no generator: enable members (members.enabled) or inClusterGenerator.enabled" }}
{{- end }}
{{- $src := .Values.template.source }}
{{- $chartSrc := $src.chart | default "" }}
{{- if and $chartSrc $src.path }}
{{- fail "template.source: set path (a chart in this repo) or chart (a Helm repository chart), not both" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ required "applicationSet.name is required" .Values.applicationSet.name | quote }}
  namespace: {{ .Values.applicationSetNamespace | quote }}
  labels:
{{- include "gitops-hub-ocm-placement-appset.labels" . | nindent 4 }}
spec:
  generators:
{{- if and $membersOn (eq $gen "clusterDecisionResource") }}
    - clusterDecisionResource:
        configMapRef: {{ .Values.generatorConfigMap.name | quote }}
{{- if $pdec }}
        name: {{ $pdec | quote }}
{{- else }}
        labelSelector:
{{- $selector := .Values.clusterDecisionResource.labelSelector | default dict }}
{{- if $selector }}
{{- toYaml $selector | nindent 10 }}
{{- else }}
          matchLabels:
            cluster.open-cluster-management.io/placement: {{ $pn | quote }}
{{- end }}
{{- end }}
        requeueAfterSeconds: {{ .Values.clusterDecisionResource.requeueAfterSeconds }}
{{- else if $membersOn }}
    - clusters:
        selector:
{{- toYaml (required "clusters.selector is required: an empty selector also selects the hub (in-cluster)" .Values.clusters.selector) | nindent 10 }}
{{- end }}
{{- if $hubOn }}
    - list:
        elements:
{{- if .Values.inClusterGenerator.clusters }}
{{- range .Values.inClusterGenerator.clusters }}
          - {{ $cpKey }}: {{ . | quote }}
{{- if eq $mode "inClusterServer" }}
            server: ""
{{- end }}
{{- end }}
{{- else }}
          - {{ $cpKey }}: {{ .Values.inClusterGenerator.clusterName | quote }}
{{- if eq $mode "inClusterServer" }}
            server: ""
{{- end }}
{{- end }}
{{- end }}
  template:
    metadata:
      name: '{{ $cp }}-{{ .Values.template.applicationNameSuffix }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
{{- if $chartSrc }}
        repoURL: {{ required "template.source.repoURL is required with template.source.chart" $src.repoURL | quote }}
        chart: {{ $chartSrc | quote }}
        targetRevision: {{ required "template.source.targetRevision (the chart version) is required with template.source.chart" $src.targetRevision | quote }}
{{- else }}
        repoURL: {{ required "repo.url must be set (same Git URL Argo uses for this repo)" .Values.repo.url | quote }}
        targetRevision: {{ .Values.repo.revision | quote }}
        path: {{ required "template.source.path is required" $src.path | quote }}
{{- end }}
{{- $helm := $src.helm | default dict }}
{{- $vf := ternary list (.Values.memberValueFiles | default list) (not (empty $chartSrc)) }}
{{- if or (and (eq $mode "clusterName") $helm.releaseName) (eq $mode "inClusterServer") ($helm.parameters) ($helm.valuesObject) $vf }}
        helm:
{{- if and (eq $mode "clusterName") $helm.releaseName }}
          releaseName: {{ $helm.releaseName | quote }}
{{- end }}
{{- with $vf }}
          valueFiles:
{{- toYaml . | nindent 12 }}
{{- end }}
{{- if eq $mode "inClusterServer" }}
          parameters:
            - name: clusterName
              value: '{{ $cp }}'
            - name: clusterServer
              value: '{{ "{{server}}" }}'
{{- range ($helm.parameters | default list) }}
            - name: {{ .name | quote }}
              value: {{ include "gitops-hub-ocm-placement-appset.paramValue" (list .value $cp) }}
{{- end }}
{{- else if $helm.parameters }}
          parameters:
{{- range $helm.parameters }}
            - name: {{ .name | quote }}
              value: {{ include "gitops-hub-ocm-placement-appset.paramValue" (list .value $cp) }}
{{- end }}
{{- end }}
{{- if $helm.valuesObject }}
          valuesObject:
{{- toYaml $helm.valuesObject | replace "{{clusterName}}" $cp | nindent 12 }}
{{- end }}
{{- end }}
      destination:
{{- if eq $mode "clusterName" }}
        name: '{{ $cp }}'
        namespace: {{ .Values.destination.namespace | quote }}
{{- else if eq $mode "inClusterServer" }}
        server: https://kubernetes.default.svc
        namespace: {{ .Values.destination.namespace | quote }}
{{- else }}
{{- fail "destination.mode must be clusterName (sync to every registered cluster by name) or inClusterServer (hub Kubernetes API only)" }}
{{- end }}
{{- if .Values.template.ignoreDifferences }}
      ignoreDifferences:
{{- toYaml .Values.template.ignoreDifferences | nindent 8 }}
{{- end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
{{- with .Values.template.syncOptions }}
        syncOptions:
{{- toYaml . | nindent 10 }}
{{- end }}
        retry:
          limit: 10
          backoff:
            duration: 15s
            maxDuration: 5m
            factor: 2
