# Preset: External Secrets Operator on the hub only (in-cluster).
# The hub ESO pushes secrets to the spokes with PushSecrets.
identity:
  component: external-secrets-operator

inClusterGenerator:
  enabled: true
  clusterName: in-cluster

clusterDecisionResource:
  enabled: false

placementRbac:
  create: false

argocdApplicationControllerRbac:
  roleName: gitops-hub-external-secrets-operator-appset-argocd-sync
  roleBindingName: gitops-hub-external-secrets-operator-appset-argocd-sync

applicationSet:
  name: hub-external-secrets-operator

destination:
  mode: clusterName
  namespace: external-secrets-operator

template:
  applicationNameSuffix: external-secrets-operator
  source:
    path: charts/external-secrets-operator
    helm:
      releaseName: external-secrets-operator-olm
