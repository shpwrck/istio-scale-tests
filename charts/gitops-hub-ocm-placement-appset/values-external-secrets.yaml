# Preset, platform kubernetes: the upstream External Secrets Operator (Helm chart) on the
# hub only (in-cluster). The hub ESO pushes secrets to the spokes with PushSecrets. OpenShift
# installs the Red Hat operator with OLM instead (values-external-secrets-olm.yaml).
identity:
  component: external-secrets-operator

inClusterGenerator:
  enabled: true
  clusterName: in-cluster

members:
  enabled: false

placementRbac:
  create: false

argocdApplicationControllerRbac:
  roleName: gitops-hub-external-secrets-operator-appset-argocd-sync
  roleBindingName: gitops-hub-external-secrets-operator-appset-argocd-sync

applicationSet:
  name: hub-external-secrets-operator

destination:
  mode: clusterName
  # Also the namespace of the SecretStores, ExternalSecrets and PushSecrets
  # (charts/hub-kubeconfig-from-argosecret, charts/hub-mesh-push-secrets).
  namespace: external-secrets-operator

template:
  applicationNameSuffix: external-secrets-operator
  source:
    # Version pin. PushSecret is still external-secrets.io/v1alpha1 in this release.
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      releaseName: external-secrets
  # The CRDs are larger than the client-side apply annotation allows.
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
