{{- if include "gitops-hub-apps.enabled" (dict "root" $ "name" "hub-external-secrets-operator-appset") }}
# ApplicationSet: External Secrets operator on the hub only (OLM on openshift, Helm chart on kubernetes).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-external-secrets-operator-appset
  namespace: {{ .Values.gitopsNamespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: gitops-hub-apps
    app.kubernetes.io/component: hub-external-secrets-operator-appset
spec:
  project: default
  source:
    repoURL: {{ include "gitops-hub-apps.repoURL" . }}
    targetRevision: {{ include "gitops-hub-apps.revision" . }}
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-hub-external-secrets-operator-appset
      {{- with include "gitops-hub-apps.valuesObject" (dict "root" $ "name" "hub-external-secrets-operator-appset") }}{{ . | nindent 6 }}{{- end }}
      valueFiles:
        {{- /* Red Hat operator (OLM) on openshift, the upstream chart on kubernetes. */}}
        - {{ ternary "values-external-secrets-olm.yaml" "values-external-secrets.yaml" (eq (include "gitops-hub-apps.platform" .) "openshift") }}
        - platform-{{ include "gitops-hub-apps.platform" . }}.yaml
      parameters:
        - name: repo.url
          value: {{ include "gitops-hub-apps.repoURL" . }}
        - name: repo.revision
          value: {{ include "gitops-hub-apps.revision" . }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.gitopsNamespace | quote }}
  syncPolicy:
    {{- include "gitops-hub-apps.syncPolicy" . | nindent 4 }}
{{- end }}
