{{- if include "gitops-hub-apps.enabled" (dict "root" $ "name" "hub-external-secrets-operator-appset") }}
# ApplicationSet: External Secrets operator on the hub only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-external-secrets-operator-appset
  namespace: {{ .Values.gitopsNamespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    app.kubernetes.io/name: gitops-hub-apps
    app.kubernetes.io/component: hub-external-secrets-operator-appset
spec:
  project: default
  source:
    repoURL: {{ include "gitops-hub-apps.repoURL" . }}
    targetRevision: {{ include "gitops-hub-apps.revision" . }}
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-hub-external-secrets-operator-appset
      {{- with include "gitops-hub-apps.valuesObject" (dict "root" $ "name" "hub-external-secrets-operator-appset") }}{{ . | nindent 6 }}{{- end }}
      valueFiles:
        - values-external-secrets.yaml
      parameters:
        - name: repo.url
          value: {{ include "gitops-hub-apps.repoURL" . }}
        - name: repo.revision
          value: {{ include "gitops-hub-apps.revision" . }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
{{- end }}
