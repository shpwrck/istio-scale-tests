{{- if include "gitops-hub-apps.enabled" (dict "root" $ "name" "spoke-east-west-gateway-appset") }}
# ApplicationSet: east-west gateway on each mesh member.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-east-west-gateway-appset
  namespace: {{ .Values.gitopsNamespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "27"
  labels:
    app.kubernetes.io/name: gitops-hub-apps
    app.kubernetes.io/component: spoke-east-west-gateway-appset
spec:
  project: default
  source:
    repoURL: {{ include "gitops-hub-apps.repoURL" . }}
    targetRevision: {{ include "gitops-hub-apps.revision" . }}
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-spoke-east-west-gateway-appset
      {{- with include "gitops-hub-apps.valuesObject" (dict "root" $ "name" "spoke-east-west-gateway-appset") }}{{ . | nindent 6 }}{{- end }}
      valueFiles:
        - values-east-west-gateway.yaml
      parameters:
        - name: repo.url
          value: {{ include "gitops-hub-apps.repoURL" . }}
        - name: repo.revision
          value: {{ include "gitops-hub-apps.revision" . }}
        - name: placement.name
          value: acm-openshift-gitops-placement
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    {{- include "gitops-hub-apps.syncPolicy" . | nindent 4 }}
{{- end }}
