{{- if include "gitops-hub-apps.enabled" (dict "root" $ "name" "hub-kubeconfig-from-argosecret-appset") }}
# ApplicationSet: per-member kubeconfig Secrets from Argo cluster Secrets (on the hub).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-kubeconfig-from-argosecret-appset
  namespace: {{ .Values.gitopsNamespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "18"
  labels:
    app.kubernetes.io/name: gitops-hub-apps
    app.kubernetes.io/component: hub-kubeconfig-from-argosecret-appset
spec:
  project: default
  source:
    repoURL: {{ include "gitops-hub-apps.repoURL" . }}
    targetRevision: {{ include "gitops-hub-apps.revision" . }}
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-hub-kubeconfig-from-argosecret-appset
      {{- with include "gitops-hub-apps.valuesObject" (dict "root" $ "name" "hub-kubeconfig-from-argosecret-appset") }}{{ . | nindent 6 }}{{- end }}
      valueFiles:
        - values-kubeconfig-from-argosecret.yaml
        - platform-{{ include "gitops-hub-apps.platform" . }}.yaml
      parameters:
        - name: repo.url
          value: {{ include "gitops-hub-apps.repoURL" . }}
        - name: repo.revision
          value: {{ include "gitops-hub-apps.revision" . }}
        - name: placement.name
          value: acm-openshift-gitops-placement
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.gitopsNamespace | quote }}
  syncPolicy:
    {{- include "gitops-hub-apps.syncPolicy" . | nindent 4 }}
{{- end }}
