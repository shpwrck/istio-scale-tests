{{- if include "gitops-hub-apps.enabled" (dict "root" $ "name" "spoke-ossm-operator-appset") }}
# ApplicationSet: the Sail operator on each mesh member (OSSM 3 via OLM on openshift, the
# upstream Helm chart on kubernetes).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-ossm-operator-appset
  namespace: {{ .Values.gitopsNamespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  labels:
    app.kubernetes.io/name: gitops-hub-apps
    app.kubernetes.io/component: spoke-ossm-operator-appset
spec:
  project: default
  source:
    repoURL: {{ include "gitops-hub-apps.repoURL" . }}
    targetRevision: {{ include "gitops-hub-apps.revision" . }}
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-spoke-ossm-operator-appset
      {{- with include "gitops-hub-apps.valuesObject" (dict "root" $ "name" "spoke-ossm-operator-appset") }}{{ . | nindent 6 }}{{- end }}
      valueFiles:
        {{- /* OSSM 3 (OLM) on openshift, the upstream Sail operator chart on kubernetes. */}}
        - {{ ternary "values-ossm-operator.yaml" "values-sail-operator.yaml" (eq (include "gitops-hub-apps.platform" .) "openshift") }}
        - platform-{{ include "gitops-hub-apps.platform" . }}.yaml
      parameters:
        - name: repo.url
          value: {{ include "gitops-hub-apps.repoURL" . }}
        - name: repo.revision
          value: {{ include "gitops-hub-apps.revision" . }}
        - name: placement.name
          value: acm-openshift-gitops-placement
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.gitopsNamespace | quote }}
  syncPolicy:
    {{- include "gitops-hub-apps.syncPolicy" . | nindent 4 }}
{{- end }}
