apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.istioSystem | quote }}
  labels:
    {{- include "spoke-istio-namespaces.labels" . | nindent 4 }}
    topology.istio.io/network: {{ printf "%s-%s" (required "clusterName is required (set per cluster by the ApplicationSet)" .Values.clusterName) .Values.networkSuffix | quote }}
