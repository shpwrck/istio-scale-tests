# Standalone Argo CD Application (not part of the app-of-apps): deploys the
# mesh-verify echo workload on every mesh member.
# Edit both repoURL fields and both revision fields to match your fork/branch.
# Apply:  oc apply -f charts/mesh-verify-appset.yaml
# Remove: oc delete -f charts/mesh-verify-appset.yaml (the finalizer also removes
#         the ApplicationSet and the per-member mesh-verify workloads)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-verify-appset
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: mesh-verify
    app.kubernetes.io/component: mesh-verify-appset
spec:
  project: default
  source:
    repoURL: https://github.com/shpwrck/istio-scale-tests.git
    targetRevision: main
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-mesh-verify-appset
      valueFiles:
        - values-mesh-verify.yaml
      parameters:
        - name: repo.url
          value: https://github.com/shpwrck/istio-scale-tests.git
        - name: repo.revision
          value: main
        - name: placement.name
          value: acm-openshift-gitops-placement
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
