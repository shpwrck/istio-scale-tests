# Standalone Argo CD Application (not part of the app-of-apps): deploys the
# mesh-verify echo workload on every mesh member.
# Keep the <repo-url> and <revision> placeholders in git and fill them in on the way
# to the hub, from the repo and revision the hub's root Application syncs (set by
# terraform/platform), so the check deploys the same charts as the mesh. Applied as
# the placeholders, this Application shows a ComparisonError and deploys nothing.
# Apply:  read -r REPO REV < <(oc --context <acm-hub-ctx> -n openshift-gitops get application \
#           hub-gitops-root -o jsonpath='{.spec.source.repoURL} {.spec.source.targetRevision}')
#         sed -e "s|<repo-url>|${REPO:?}|g" -e "s|<revision>|${REV:?}|g" charts/mesh-verify-appset.yaml \
#           | oc --context <acm-hub-ctx> apply -f -
# Remove: oc --context <acm-hub-ctx> delete -f charts/mesh-verify-appset.yaml (the finalizer
#         also removes the ApplicationSet and the per-member mesh-verify workloads)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-verify-appset
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: mesh-verify
    app.kubernetes.io/component: mesh-verify-appset
spec:
  project: default
  source:
    repoURL: <repo-url>
    targetRevision: <revision>
    path: charts/gitops-hub-ocm-placement-appset
    helm:
      releaseName: gitops-mesh-verify-appset
      valueFiles:
        - values-mesh-verify.yaml
      parameters:
        - name: repo.url
          value: <repo-url>
        - name: repo.revision
          value: <revision>
        - name: placement.name
          value: acm-openshift-gitops-placement
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
