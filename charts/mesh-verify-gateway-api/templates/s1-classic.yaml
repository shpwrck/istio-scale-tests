# S1 baseline: classic Istio Gateway + VirtualService on every member; echo-s1 exists on the
# workload member only.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: s1-classic
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mesh-verify-gateway-api.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - s1.classic.test
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: s1
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mesh-verify-gateway-api.labels" . | nindent 4 }}
spec:
  hosts:
    - s1.classic.test
  gateways:
    - s1-classic
  http:
    - route:
        - destination:
            host: {{ printf "echo-s1.%s.svc.%s" .Values.namespace .Values.clusterDomain }}
            port:
              number: {{ .Values.service.port }}
