{{- /* One template for every scenario Service: the S3 stub (other members) and the workload's
     Services render identically, so ports and port names cannot drift. A backendNs remote Service
     lives in remoteNamespace, which exists on the workload member only, so it must be
     workloadOnly. */ -}}
{{- $isWorkload := include "mesh-verify-gateway-api.isWorkload" . }}
{{- $sc := include "mesh-verify-gateway-api.scenarios" . | fromYaml }}
{{- range $s := $sc.services }}
{{- if and (eq $s.backendNs "remote") (not $s.workloadOnly) }}
{{- fail (printf "Service %s: a backendNs remote Service must be workloadOnly (its namespace exists on the workload member only)" $s.name) }}
{{- end }}
{{- if or (not $s.workloadOnly) $isWorkload }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $s.name }}
  namespace: {{ include "mesh-verify-gateway-api.backendNamespace" (dict "s" $s "Values" $.Values) }}
  labels:
    {{- include "mesh-verify-gateway-api.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "mesh-verify-gateway-api.selectorLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      protocol: TCP
      targetPort: {{ $.Values.service.port }}
{{- end }}
{{- end }}
