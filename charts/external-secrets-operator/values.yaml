# Namespace for the Red Hat External Secrets operator Subscription.
namespace: external-secrets-operator

argoSyncWaves:
  enabled: true
  rbac: -20
  externalSecretsConfig: "5"

# Roles for the Argo CD application controller (OLM objects, cleanup hook,
# ExternalSecretsConfig, operand NetworkPolicy).
rbac:
  enabled: true
  argocd:
    namespace: openshift-gitops
    serviceAccountName: openshift-gitops-argocd-application-controller
  labels: {}
  annotations: {}

operatorGroup:
  name: openshift-external-secrets-operator

externalSecretsConfig:
  enabled: true

# Extra egress for the ESO controller so hub PushSecrets reach the spoke API
# servers (443 for ROSA HCP, 6443 for self-managed OpenShift).
spokeEgress:
  enabled: true
  operandNamespace: external-secrets
  ports: [443, 6443]

subscription:
  name: openshift-external-secrets-operator
  channel: stable-v1
  package: openshift-external-secrets-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# oc image for the PreDelete cleanup Job. Match the tag to the cluster's OpenShift minor.
image:
  repository: registry.redhat.io/openshift4/ose-cli-rhel9
  tag: v4.21
