# Namespace of the Argo CD instance (Applications live here).
gitopsNamespace: openshift-gitops

# Git repo the root and every child Application sync from (your fork/branch).
repo:
  url: ""
  revision: main

# Passed to charts/gitops-hub-apps, e.g. {hub-cert-manager-operator: {enabled: false}}.
apps: {}

syncPolicy:
  automated:
    prune: false
    selfHeal: true
